[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "luteastress"
version = "0.1.0"
description = "Computational study of menstrual cycle alignment via shared stressors"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "tqdm>=4.66",
]

[project.scripts]
luteastress = "src.run_study:main"

[tool.maturin]
manifest-path = "native/Cargo.toml"
module-name = "luteastress_native"
